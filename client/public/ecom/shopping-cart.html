<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart - LUXE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/navigation.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body>
  <div id="nav-placeholder"></div>
  <div class="reading-progress"></div>

  <div class="container" style="padding-top: calc(80px + var(--space-2xl)); padding-bottom: var(--space-2xl);">
    <h1 style="margin-bottom: var(--space-xl);">Shopping Cart</h1>

    <div id="cart-content"></div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/theme-toggle.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/nav.js"></script>

  <script>
      const cartContent = document.getElementById('cart-content');
      const cart = window.ShoppingCart;

      if (cart.items.length === 0) {
        cartContent.innerHTML = `
          <div style="text-align: center; padding: var(--space-2xl); background: var(--bg-secondary); border-radius: var(--radius-lg);">
            <div style="font-size: 4rem; margin-bottom: var(--space-md);">🛒</div>
            <h2 style="margin-bottom: var(--space-md);">Your cart is empty</h2>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-lg);">Start shopping to add items to your cart</p>
            <a href="shop.html" class="btn btn-primary btn-lg">Continue Shopping</a>
          </div>
        `;
        return;
      }

      cartContent.innerHTML = `
        <div style="display: grid; grid-template-columns: 1fr 400px; gap: var(--space-2xl);">
          <div>
            <div class="card" style="padding: var(--space-lg);">
              ${cart.items.map(item => `
                <div class="cart-item" data-id="${item.id}" style="display: grid; grid-template-columns: 100px 1fr auto; gap: var(--space-md); padding: var(--space-md) 0; border-bottom: 1px solid var(--border-light);" data-testid="cart-item-${item.id}">
                  <img src="${item.image}" alt="${item.name}" style="width: 100px; height: 100px; object-fit: cover; border-radius: var(--radius-md);">
                  
                  <div style="display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                      <h3 style="font-size: 1.125rem; margin-bottom: 0.25rem;">${item.name}</h3>
                      <div style="color: var(--text-secondary); font-size: 0.875rem;">$${item.price.toFixed(2)} each</div>
                    </div>
                    
                    <div style="display: flex; gap: var(--space-md); align-items: center;">
                      <div class="counter">
                        <button class="counter-btn" onclick="updateItemQuantity('${item.id}', -1)" data-testid="button-decrease-${item.id}">−</button>
                        <span class="counter-value">${item.quantity}</span>
                        <button class="counter-btn" onclick="updateItemQuantity('${item.id}', 1)" data-testid="button-increase-${item.id}">+</button>
                      </div>
                      
                      <button class="btn btn-sm btn-outline" style="color: var(--error);" onclick="removeItem('${item.id}')" data-testid="button-remove-${item.id}">
                        Remove
                      </button>
                    </div>
                  </div>
                  
                  <div style="text-align: right;">
                    <div class="price" style="font-size: 1.25rem;">$${(item.price * item.quantity).toFixed(2)}</div>
                  </div>
                </div>
              `).join('')}
            </div>

            <div style="margin-top: var(--space-md); text-align: right;">
              <button class="btn btn-outline" onclick="clearCart()" data-testid="button-clear-cart">Clear Cart</button>
            </div>
          </div>

          <div>
            <div class="card" style="padding: var(--space-lg); position: sticky; top: 100px;">
              <h3 style="margin-bottom: var(--space-lg);">Order Summary</h3>
              
              <div style="display: flex; justify-content: space-between; margin-bottom: var(--space-sm);">
                <span style="color: var(--text-secondary);">Subtotal (${cart.getItemCount()} items)</span>
                <span>$${cart.getTotal().toFixed(2)}</span>
              </div>
              
              <div style="display: flex; justify-content: space-between; margin-bottom: var(--space-sm);">
                <span style="color: var(--text-secondary);">Shipping</span>
                <span style="color: var(--success);">FREE</span>
              </div>
              
              <div class="divider"></div>
              
              <div style="display: flex; justify-content: space-between; margin-bottom: var(--space-xl);">
                <span style="font-weight: 700; font-size: 1.125rem;">Total</span>
                <span class="price" style="font-size: 1.5rem;">$${cart.getTotal().toFixed(2)}</span>
              </div>
              
              <a href="checkout.html" class="btn btn-gradient btn-lg btn-magnetic" style="width: 100%;" data-testid="button-proceed-checkout">
                Proceed to Checkout
              </a>
              
              <a href="shop.html" class="btn btn-outline btn-lg" style="width: 100%; margin-top: var(--space-sm);" data-testid="button-continue-shopping">
                Continue Shopping
              </a>
            </div>
          </div>
        </div>
      `;
    }

    function updateItemQuantity(id, change) {
      const item = window.ShoppingCart.items.find(i => i.id === id);
      if (item) {
        window.ShoppingCart.updateQuantity(id, item.quantity + change);
        renderCart();
      }
    }

    function removeItem(id) {
      window.ShoppingCart.removeItem(id);
      renderCart();
    }

    function clearCart() {
      if (confirm('Are you sure you want to clear your cart?')) {
        window.ShoppingCart.clearCart();
        renderCart();
      }
    }

    window.addEventListener('cartUpdated', renderCart);
    renderCart();

    window.addEventListener('scroll', () => {
      const scrolled = (window.pageYOffset / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
      document.querySelector('.reading-progress').style.width = scrolled + '%';
    });
  </script>

  <style>
    @media (max-width: 1024px) {
      #cart-content > div {
        grid-template-columns: 1fr !important;
      }

      .cart-item {
        grid-template-columns: 80px 1fr !important;
      }

      .cart-item > div:last-child {
        grid-column: 1 / -1;
        text-align: left !important;
        margin-top: var(--space-sm);
      }
    }
  </style>
</body>
</html>
