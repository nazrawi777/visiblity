<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUXE - Minimalist Lifestyle | Home V3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/navigation.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/studio-freight/lenis@1.0.19/bundled/lenis.min.js"></script>
</head>
<body>
  <div id="nav-placeholder"></div>
  <div class="reading-progress"></div>

  <!-- Minimalist Hero -->
  <section class="section-hero" style="background: var(--bg-primary); padding: var(--space-2xl) 0;">
    <div class="container">
      <div style="max-width: 700px; margin: 0 auto; text-align: center; padding: var(--space-2xl) 0;">
        <h1 style="margin-bottom: var(--space-lg); font-size: clamp(3rem, 6vw, 5rem);">
          Less is <span style="color: var(--primary);">More</span>
        </h1>
        <p style="font-size: 1.25rem; color: var(--text-secondary); margin-bottom: var(--space-xl);">
          Carefully curated essentials for intentional living
        </p>
        <a href="shop.html" class="btn btn-primary btn-lg btn-magnetic">Explore Essentials</a>
      </div>

      <!-- Large Featured Product -->
      <div style="max-width: 800px; margin: var(--space-2xl) auto;">
        <div class="card hover-lift" style="padding: 0; overflow: hidden;">
          <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=1200&h=600&fit=crop" alt="Featured" style="width: 100%; height: 400px; object-fit: cover;">
          <div style="padding: var(--space-xl);">
            <div class="badge badge-primary" style="margin-bottom: var(--space-sm);">Editor's Choice</div>
            <h2 style="margin-bottom: var(--space-sm);">Premium Wireless Headphones</h2>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-md);">Experience audio like never before with our flagship headphones</p>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <div class="price" style="font-size: 2rem;">$299</div>
              <button class="btn btn-gradient btn-magnetic" onclick="addToCart('prod-14', 'Premium Wireless Headphones', 299, 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=1200&h=600&fit=crop')">Add to Cart</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Simple Grid -->
  <section style="padding: var(--space-2xl) 0; background: var(--bg-secondary);">
    <div class="container">
      <div class="grid grid-3" style="gap: var(--space-xl);">
        <div class="card card-product hover-lift">
          <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=400&fit=crop" alt="Watch" class="product-image">
          <h3>Minimalist Watch</h3>
          <div class="price">$199</div>
          <button class="btn btn-outline btn-sm" style="width: 100%;" onclick="addToCart('prod-15', 'Minimalist Watch', 199, 'https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=400&h=400&fit=crop')">Add to Cart</button>
        </div>

        <div class="card card-product hover-lift">
          <img src="https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400&h=400&fit=crop" alt="Sunglasses" class="product-image">
          <h3>Designer Sunglasses</h3>
          <div class="price">$149</div>
          <button class="btn btn-outline btn-sm" style="width: 100%;" onclick="addToCart('prod-16', 'Designer Sunglasses', 149, 'https://images.unsplash.com/photo-1572635196237-14b3f281503f?w=400&h=400&fit=crop')">Add to Cart</button>
        </div>

        <div class="card card-product hover-lift">
          <img src="https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=400&h=400&fit=crop" alt="Sneakers" class="product-image">
          <h3>Classic Sneakers</h3>
          <div class="price">$129</div>
          <button class="btn btn-outline btn-sm" style="width: 100%;" onclick="addToCart('prod-17', 'Classic Sneakers', 129, 'https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=400&h=400&fit=crop')">Add to Cart</button>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/theme-toggle.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/smooth-scroll.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/nav.js"></script>
  <script>
      const scrolled = (window.pageYOffset / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
      document.querySelector('.reading-progress').style.width = scrolled + '%';
    });
  </script>
</body>
</html>
