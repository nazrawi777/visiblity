<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wishlist - LUXE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/navigation.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body>
  <div id="nav-placeholder"></div>
  <div class="reading-progress"></div>

  <div class="container" style="padding-top: calc(80px + var(--space-2xl)); padding-bottom: var(--space-2xl);">
    <h1 style="margin-bottom: var(--space-xl);">My Wishlist</h1>

    <div id="wishlist-content"></div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/theme-toggle.js"></script>
  <script src="js/cursor.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/nav.js"></script>

  <script>
      const wishlistContent = document.getElementById('wishlist-content');
      const wishlist = window.Wishlist;

      if (wishlist.items.length === 0) {
        wishlistContent.innerHTML = `
          <div style="text-align: center; padding: var(--space-2xl); background: var(--bg-secondary); border-radius: var(--radius-lg);">
            <div style="font-size: 4rem; margin-bottom: var(--space-md);">🤍</div>
            <h2 style="margin-bottom: var(--space-md);">Your wishlist is empty</h2>
            <p style="color: var(--text-secondary); margin-bottom: var(--space-lg);">Save your favorite items for later</p>
            <a href="shop.html" class="btn btn-primary btn-lg">Start Shopping</a>
          </div>
        `;
        return;
      }

      wishlistContent.innerHTML = `
        <div class="grid grid-4" style="gap: var(--space-lg);">
          ${wishlist.items.map(item => `
            <div class="card card-product hover-lift" data-testid="wishlist-item-${item.id}">
              <button class="btn-icon" style="position: absolute; top: 1rem; right: 1rem; z-index: 2; background: white; box-shadow: var(--shadow-md);" onclick="removeFromWishlist('${item.id}')" data-testid="button-remove-wishlist-${item.id}">
                ❤️
              </button>
              <img src="${item.image}" alt="${item.name}" class="product-image">
              <h3 style="font-size: 1rem; margin-bottom: var(--space-sm);">${item.name}</h3>
              <div class="price" style="margin-bottom: var(--space-md);">$${item.price.toFixed(2)}</div>
              <button class="btn btn-primary btn-sm btn-magnetic" style="width: 100%;" onclick="moveToCart('${item.id}')" data-testid="button-move-to-cart-${item.id}">
                Move to Cart
              </button>
            </div>
          `).join('')}
        </div>

        <div style="margin-top: var(--space-2xl); text-align: center;">
          <button class="btn btn-outline" onclick="clearWishlist()" data-testid="button-clear-wishlist">Clear Wishlist</button>
        </div>
      `;
    }

    function removeFromWishlist(id) {
      window.Wishlist.removeItem(id);
      renderWishlist();
    }

    function moveToCart(id) {
      window.Wishlist.moveToCart(id);
      renderWishlist();
    }

    function clearWishlist() {
      if (confirm('Are you sure you want to clear your wishlist?')) {
        window.Wishlist.clearWishlist();
        renderWishlist();
      }
    }

    window.addEventListener('wishlistUpdated', renderWishlist);
    renderWishlist();

    window.addEventListener('scroll', () => {
      const scrolled = (window.pageYOffset / (document.documentElement.scrollHeight - window.innerHeight)) * 100;
      document.querySelector('.reading-progress').style.width = scrolled + '%';
    });
  </script>
</body>
</html>
