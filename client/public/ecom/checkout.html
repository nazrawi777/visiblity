<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - LUXE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/navigation.css">
</head>
<body>
  <div id="nav-placeholder"></div>

  <div class="container" style="padding-top: calc(80px + var(--space-2xl)); padding-bottom: var(--space-2xl);">
    <h1 style="margin-bottom: var(--space-xl);">Checkout</h1>

    <div style="display: grid; grid-template-columns: 1fr 400px; gap: var(--space-2xl);">
      <div>
        <!-- Progress Steps -->
        <div style="display: flex; gap: var(--space-md); margin-bottom: var(--space-2xl); justify-content: space-between;">
          <div class="checkout-step active" data-step="1" style="flex: 1; text-align: center;">
            <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-xs); font-weight: 700;">1</div>
            <div style="font-size: 0.875rem; font-weight: 600;">Contact</div>
          </div>
          <div class="checkout-step" data-step="2" style="flex: 1; text-align: center; opacity: 0.5;">
            <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--bg-tertiary); color: var(--text-primary); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-xs); font-weight: 700;">2</div>
            <div style="font-size: 0.875rem; font-weight: 600;">Shipping</div>
          </div>
          <div class="checkout-step" data-step="3" style="flex: 1; text-align: center; opacity: 0.5;">
            <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--bg-tertiary); color: var(--text-primary); display: flex; align-items: center; justify-content: center; margin: 0 auto var(--space-xs); font-weight: 700;">3</div>
            <div style="font-size: 0.875rem; font-weight: 600;">Review</div>
          </div>
        </div>

        <!-- Forms -->
        <div id="form-container"></div>
      </div>

      <!-- Order Summary -->
      <div>
        <div class="card" style="padding: var(--space-lg); position: sticky; top: 100px;">
          <h3 style="margin-bottom: var(--space-lg);">Order Summary</h3>
          
          <div id="summary-items" style="max-height: 300px; overflow-y: auto; margin-bottom: var(--space-md);"></div>
          
          <div class="divider"></div>
          
          <div style="display: flex; justify-content: space-between; margin-bottom: var(--space-sm);">
            <span style="color: var(--text-secondary);">Subtotal</span>
            <span id="summary-subtotal">$0.00</span>
          </div>
          
          <div style="display: flex; justify-content: space-between; margin-bottom: var(--space-sm);">
            <span style="color: var(--text-secondary);">Shipping</span>
            <span style="color: var(--success);">FREE</span>
          </div>
          
          <div class="badge badge-warning" style="width: 100%; justify-content: center; margin: var(--space-md) 0;">
            🔥 Save $50 - Limited Time Offer
          </div>
          
          <div class="divider"></div>
          
          <div style="display: flex; justify-content: space-between;">
            <span style="font-weight: 700; font-size: 1.125rem;">Total</span>
            <span class="price" id="summary-total" style="font-size: 1.5rem;">$0.00</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/theme-toggle.js"></script>
  <script src="js/nav.js"></script>

  <script>
    const formData = {};

    function renderStep(step) {
      const container = document.getElementById('form-container');
      
      if (step === 1) {
        container.innerHTML = `
          <div class="card" style="padding: var(--space-xl);">
            <h2 style="margin-bottom: var(--space-lg);">Contact Information</h2>
            <form id="contact-form">
              <div class="input-group">
                <label>Email</label>
                <input type="email" required placeholder="your@email.com" data-testid="input-email">
              </div>
              <div class="input-group">
                <label>Full Name</label>
                <input type="text" required placeholder="John Doe" data-testid="input-name">
              </div>
              <button type="submit" class="btn btn-primary btn-lg" style="width: 100%;" data-testid="button-continue-shipping">Continue to Shipping</button>
            </form>
          </div>
        `;
        
        document.getElementById('contact-form').onsubmit = (e) => {
          e.preventDefault();
          formData.email = e.target.querySelector('[type="email"]').value;
          formData.name = e.target.querySelector('[type="text"]').value;
          nextStep();
        };
      } else if (step === 2) {
        container.innerHTML = `
          <div class="card" style="padding: var(--space-xl);">
            <h2 style="margin-bottom: var(--space-lg);">Shipping Address</h2>
            <form id="shipping-form">
              <div class="input-group">
                <label>Address</label>
                <input type="text" required placeholder="123 Main St" data-testid="input-address">
              </div>
              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-md);">
                <div class="input-group">
                  <label>City</label>
                  <input type="text" required placeholder="City" data-testid="input-city">
                </div>
                <div class="input-group">
                  <label>Zip Code</label>
                  <input type="text" required placeholder="12345" data-testid="input-zip">
                </div>
              </div>
              <div class="input-group">
                <label>Country</label>
                <select required data-testid="select-country">
                  <option value="US">United States</option>
                  <option value="CA">Canada</option>
                  <option value="UK">United Kingdom</option>
                </select>
              </div>
              <div style="display: flex; gap: var(--space-md);">
                <button type="button" class="btn btn-outline btn-lg" style="flex: 1;" onclick="prevStep()" data-testid="button-back-contact">Back</button>
                <button type="submit" class="btn btn-primary btn-lg" style="flex: 1;" data-testid="button-continue-review">Continue to Review</button>
              </div>
            </form>
          </div>
        `;
        
        document.getElementById('shipping-form').onsubmit = (e) => {
          e.preventDefault();
          const form = e.target;
          formData.address = form.querySelector('[placeholder="123 Main St"]').value;
          formData.city = form.querySelector('[placeholder="City"]').value;
          formData.zip = form.querySelector('[placeholder="12345"]').value;
          formData.country = form.querySelector('select').value;
          nextStep();
        };
      } else if (step === 3) {
        container.innerHTML = `
          <div class="card" style="padding: var(--space-xl);">
            <h2 style="margin-bottom: var(--space-lg);">Review & Complete</h2>
            
            <div style="background: var(--bg-tertiary); padding: var(--space-md); border-radius: var(--radius-md); margin-bottom: var(--space-lg);">
              <h4 style="margin-bottom: var(--space-sm); font-size: 0.875rem; color: var(--text-secondary);">CONTACT</h4>
              <div style="font-weight: 600;">${formData.email}</div>
              <div>${formData.name}</div>
            </div>
            
            <div style="background: var(--bg-tertiary); padding: var(--space-md); border-radius: var(--radius-md); margin-bottom: var(--space-xl);">
              <h4 style="margin-bottom: var(--space-sm); font-size: 0.875rem; color: var(--text-secondary);">SHIPPING</h4>
              <div>${formData.address}</div>
              <div>${formData.city}, ${formData.zip}</div>
              <div>${formData.country}</div>
            </div>

            <p style="color: var(--text-secondary); margin-bottom: var(--space-lg); padding: var(--space-md); background: var(--bg-secondary); border-radius: var(--radius-md); border-left: 4px solid var(--primary);">
              📦 This is a demo store. No payment will be processed. Click "Complete Order" to receive a download link for this template.
            </p>
            
            <div style="display: flex; gap: var(--space-md);">
              <button class="btn btn-outline btn-lg" style="flex: 1;" onclick="prevStep()" data-testid="button-back-shipping">Back</button>
              <button class="btn btn-gradient btn-lg btn-magnetic" style="flex: 1;" onclick="completeOrder()" data-testid="button-complete-order">Complete Order</button>
            </div>
          </div>
        `;
      }
      
      updateStepIndicators();
    }

    function updateStepIndicators() {
      document.querySelectorAll('.checkout-step').forEach((step, index) => {
        const stepNum = index + 1;
        if (stepNum <= currentStep) {
          step.classList.add('active');
          step.style.opacity = '1';
          step.querySelector('div').style.background = 'var(--primary)';
          step.querySelector('div').style.color = 'white';
        } else {
          step.classList.remove('active');
          step.style.opacity = '0.5';
          step.querySelector('div').style.background = 'var(--bg-tertiary)';
          step.querySelector('div').style.color = 'var(--text-primary)';
        }
      });
    }

    function nextStep() {
      if (currentStep < 3) {
        currentStep++;
        renderStep(currentStep);
      }
    }

    function prevStep() {
      if (currentStep > 1) {
        currentStep--;
        renderStep(currentStep);
      }
    }

    function completeOrder() {
      // Show success message
      const container = document.getElementById('form-container');
      container.innerHTML = `
        <div class="card scale-pop" style="padding: var(--space-2xl); text-align: center;">
          <div style="font-size: 5rem; margin-bottom: var(--space-md);">🎉</div>
          <h2 style="margin-bottom: var(--space-md);">Order Complete!</h2>
          <p style="color: var(--text-secondary); margin-bottom: var(--space-xl);">
            Thank you for exploring our demo! This premium eCommerce template is ready to use.
          </p>
          <div style="background: var(--bg-tertiary); padding: var(--space-lg); border-radius: var(--radius-md); margin-bottom: var(--space-lg);">
            <div style="font-weight: 600; margin-bottom: var(--space-sm);">Order Details</div>
            <div style="color: var(--text-secondary); font-size: 0.875rem;">Sent to: ${formData.email}</div>
          </div>
          <div style="display: flex; gap: var(--space-md); justify-content: center;">
            <a href="index.html" class="btn btn-primary btn-lg">Back to Home</a>
            <a href="shop.html" class="btn btn-outline btn-lg">Continue Shopping</a>
          </div>
        </div>
      `;
      
      // Clear cart
      window.ShoppingCart.clearCart();
    }

    function updateSummary() {
      const cart = window.ShoppingCart;
      const summaryItems = document.getElementById('summary-items');
      const summarySubtotal = document.getElementById('summary-subtotal');
      const summaryTotal = document.getElementById('summary-total');
      
      if (cart.items.length === 0) {
        summaryItems.innerHTML = '<p style="text-align: center; color: var(--text-secondary);">No items in cart</p>';
        summarySubtotal.textContent = '$0.00';
        summaryTotal.textContent = '$0.00';
        return;
      }
      
      summaryItems.innerHTML = cart.items.map(item => `
        <div style="display: flex; gap: var(--space-sm); margin-bottom: var(--space-md);">
          <img src="${item.image}" alt="${item.name}" style="width: 60px; height: 60px; object-fit: cover; border-radius: var(--radius-sm);">
          <div style="flex: 1;">
            <div style="font-weight: 600; font-size: 0.875rem; margin-bottom: 0.25rem;">${item.name}</div>
            <div style="color: var(--text-secondary); font-size: 0.75rem;">Qty: ${item.quantity}</div>
          </div>
          <div style="font-weight: 600;">$${(item.price * item.quantity).toFixed(2)}</div>
        </div>
      `).join('');
      
      const total = cart.getTotal();
      summarySubtotal.textContent = '$' + total.toFixed(2);
      summaryTotal.textContent = '$' + total.toFixed(2);
    }

    window.addEventListener('cartUpdated', updateSummary);
    renderStep(1);
    updateSummary();
  </script>

  <style>
    @media (max-width: 1024px) {
      .container > div {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</body>
</html>
